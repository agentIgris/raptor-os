name: CI

# Every gate here corresponds to a way the legacy project shipped broken code.
# The pipeline is the control that makes every other recommendation enforceable
# rather than aspirational.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile only)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint packages apps --max-warnings 0

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The legacy lockfile carried 97 advisories including 4 critical. This gate
      # is why the current one carries zero.
      - name: Dependency audit — no critical or high
        run: pnpm audit --prod --audit-level high

      # ADR-0012: the build gates must stay enabled.
      #
      # The check is for the gate being ENABLED, not for the word appearing.
      # `apps/web/next.config.ts` sets `ignoreBuildErrors: false` on purpose —
      # the literal `false` rather than the property's absence, so a test can
      # assert it — and its header explains at length why. A grep for the bare
      # property names therefore matched a file that had the gate ON and
      # correctly disabled, and failed the build for the wrong reason. A gate
      # that fires on the correct code is a gate people learn to ignore.
      #
      # `apps/web/src/__tests__/build-gates.test.ts` asserts the resolved value
      # of the real config, so the pair is: the test proves the value, and this
      # grep catches a literal `true` appearing in ANY config.
      - name: Assert build gates are not disabled
        run: |
          if grep -rnE 'ignore(BuildErrors|DuringBuilds)[[:space:]]*:[[:space:]]*true' apps packages \
            --include='next.config.*' --include='*.config.*'; then
            echo "::error::ignoreBuildErrors / ignoreDuringBuilds must never be enabled (ADR-0012)"
            exit 1
          fi

      - name: Assert no console.* in application code
        run: |
          if grep -rnE 'console\.(log|info|debug|warn|error)' apps/*/src \
            --include='*.ts' --include='*.tsx' 2>/dev/null \
            | grep -v 'logger.ts' | grep -v '\.test\.'; then
            echo "::error::bare console.* found; use the structured logger (ADR-0012)"
            exit 1
          fi

      - name: Assert no real secrets committed
        run: |
          if git ls-files | grep -E '^\.env$|\.env\.local$'; then
            echo "::error::an environment file containing secrets is tracked"
            exit 1
          fi

      - name: Assert migration ledger has no duplicate ordering
        run: |
          ls packages/db/migrations/*.sql | xargs -n1 basename | cut -c1-4 | sort | uniq -d \
            | grep . && { echo "::error::duplicate migration prefix"; exit 1; } || echo "ledger ok"

      # A link only breaks when a file is MOVED, which is exactly when nobody
      # is looking at the documentation. Two ADR links were broken that way
      # before this gate existed.
      - name: Assert every relative documentation link resolves
        run: node scripts/check-doc-links.mjs

      # The Payload admin's component import map is GENERATED and committed.
      # A stale one leaves the admin's collection cards unresolved — they
      # render as large empty icons, and nothing else fails — so the map is
      # regenerated here and compared against what is committed.
      #
      # The generator only WRITES when an entry is missing ("No new imports
      # found, skipping writing"), so this catches the direction that breaks
      # the admin: a committed map that is missing a component. Extra entries
      # are harmless — they point at components that still exist.
      - name: Assert the Payload import map is the generated one
        run: |
          pnpm --filter @raptor/cms cms:generate-importmap
          if ! git diff --exit-code -- "apps/web/src/app/(payload)/importMap.js"; then
            echo "::error::the Payload import map is stale — run pnpm --filter @raptor/cms cms:generate-importmap and commit the result"
            exit 1
          fi

  build-gate:
    name: Build gates enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint . --max-warnings 0