packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - drizzle-orm@0.45.4
overrides:
  # drizzle-kit pulls @esbuild-kit/core-utils, which pins esbuild 0.18.20 and is
  # flagged for GHSA-67mh-4wv8-2f99 (any website may query the esbuild dev
  # server and read its response). It reaches the tree only because
  # drizzle-kit is a peerDependency of better-auth.
  #
  # The advisory is scoped to the dev server and is not reachable from the
  # deployed product, so this override is scoped to that one transitive parent
  # rather than applied globally: forcing esbuild across drizzle-kit's own tree
  # risks an API mismatch for no security gain. If drizzle-kit later ships a
  # fixed @esbuild-kit/core-utils, this override should be deleted rather than
  # left to mask the upgrade.
  "@esbuild-kit/core-utils>esbuild": "0.25.12"

  # payload 3.90.2 pins undici to 7.29.0 exactly, which is affected by two
  # advisories: GHSA-rfgv-xxqx-mfg5 (denial of service via an unrequested
  # WebSocket subprotocol) and GHSA-w293-vg96-wgc3 (TLS certificate validation
  # bypass through dropped connect options in BalancedPool). Both are fixed in
  # 7.29.1.
  #
  # The pin is EXACT in the upstream package, so the version cannot be moved by
  # a lockfile refresh — an override is the only lever, and 7.29.1 is a patch
  # release of the same major, so the override carries no API risk. When
  # payload pins a patched version itself, this override should be deleted.
  undici: "7.29.1"

auditConfig:
  # braces <=3.0.3 is flagged for GHSA-vfj7-8cjw-p6xm (stack exhaustion through
  # deeply nested patterns). There is NO PATCHED VERSION: 3.0.3 is the latest
  # release, so the advisory cannot be fixed by upgrading anything.
  #
  # Where it reaches the tree: next > sass > chokidar > braces. `sass` is an
  # OPTIONAL dependency of next, and this repository compiles no Sass — there
  # is not one .scss file in the workspace — so the path exists in the lockfile
  # and nowhere else. The vulnerable function is a glob-pattern expander used by
  # chokidar's file watcher, which runs in the dev server and the build, and
  # the input it expands is a build-time path pattern, not anything a request
  # can supply.
  #
  # So the exposure is a denial of service against a LOCAL BUILD, triggered by
  # a pattern nobody can supply, in a package with no fix available. It is
  # recorded here rather than silently ignored, with the reason, so a reviewer
  # can disagree with it. If next drops its optional `sass` dependency, or
  # chokidar replaces braces, or braces ships a fix, this entry should be
  # deleted.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
