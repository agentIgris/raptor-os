<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Favicon High-Contrast Gold Gradient -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <!-- Favicon Crimson Gradient -->
    <linearGradient id="fav-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
  </defs>

  <!-- Rounded Dark Shield / Squircle Backer (Ensures high contrast on both dark and light browser tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#111111" stroke="#D4AF37" stroke-width="3" />
  
  <!-- Subtle Inset Shield Border for depth -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="11.5" fill="none" stroke="#B71C1C" stroke-width="1.5" opacity="0.8" />

  <!-- Streamlined High-Contrast Raptor Mascot Mark (Legible down to 16x16px) -->
  <g id="fav-raptor">
    <!-- Top Crown Quills (White highlight & Gold) -->
    <polygon points="32,9 29,19 32,18" fill="#FFFFFF" />
    <polygon points="32,9 35,19 32,18" fill="url(#fav-gold)" />
    
    <!-- Flanking Quills (Crimson & Blood Red) -->
    <polygon points="29,14 20,11 25,23 32,18" fill="url(#fav-red)" />
    <polygon points="35,14 44,11 39,23 32,18" fill="#780E0E" />

    <!-- Outer Cheek Flares -->
    <polygon points="22,19 12,20 20,29 26,25" fill="url(#fav-gold)" />
    <polygon points="42,19 52,20 44,29 38,25" fill="#8F6B12" />

    <!-- Cranial Brow Ridge (Razor Sharp Scowl) -->
    <polygon points="32,24 23,24 16,23 18,28 26,30 32,31" fill="#FFFFFF" />
    <polygon points="32,24 41,24 48,23 46,28 38,30 32,31" fill="url(#fav-gold)" />

    <!-- Piercing Glowing Raptor Eyes (Amber & White) -->
    <polygon points="19,27 25,28 23,31 18,29" fill="#FFC107" />
    <polygon points="21,28 24,28 23,30" fill="#FFFFFF" />
    <polygon points="45,27 39,28 41,31 46,29" fill="#FFC107" />
    <polygon points="43,28 40,28 41,30" fill="#FFFFFF" />

    <!-- Massive Hooked Beak (High Contrast Amber Gold) -->
    <polygon points="32,31 26,32 25,38 32,49 32,43" fill="url(#fav-gold)" />
    <polygon points="32,31 29,38 32,49" fill="#FFFFFF" opacity="0.9" />
    <polygon points="32,31 38,32 39,38 32,49 32,43" fill="#8F6B12" />

    <!-- Mouth Cavity & Fangs -->
    <polygon points="26,39 32,43 38,39 36,44 32,46 28,44" fill="#111111" />
    <polygon points="27,39 29,43 30,40" fill="#FFFFFF" />
    <polygon points="37,39 35,43 34,40" fill="#FFFFFF" />

    <!-- Armored Mandible / Jaw Plates -->
    <polygon points="22,34 26,42 32,53 32,47 28,43 23,38" fill="url(#fav-red)" />
    <polygon points="42,34 38,42 32,53 32,47 36,43 41,38" fill="#780E0E" />

    <!-- Bottom Shield Anchor Chevron -->
    <polygon points="32,53 36,50 40,48 32,57 24,48 28,50" fill="url(#fav-gold)" />
  </g>
</svg>
